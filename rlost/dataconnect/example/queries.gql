
query ListLostItems @auth(level: PUBLIC) {
  items {
    id
    itemName
    description
    location
    imageLink
    category
    lostStatus
  }
}

query ListFoundItems @auth(level: PUBLIC) {
  items(where: { lostStatus: { eq: false } }) {
    id
    itemName
    description
    location
    imageLink
    category
    lostStatus
    locationTurnedIn
    timeFound
  }
}