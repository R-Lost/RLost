mutation CreateItem(
  $itemName: String!
  $description: String
  $location: String
  $imageLink: String
  $category: String
  $lostStatus: Boolean!
  $locationTurnedIn: String
  $timeFound: String
) @auth(level: USER) {
  item_insert(data: {
    itemName: $itemName
    description: $description
    location: $location
    imageLink: $imageLink
    category: $category
    lostStatus: $lostStatus
    locationTurnedIn: $locationTurnedIn
    timeFound: $timeFound
    userId_expr: "auth.uid"
  })
} # In future need to make auth level @user I think
mutation UpsertUser(
  $username: String!
  $email: String!
  $photoUrl: String
) @auth(level: USER) {
  user_upsert(data: {
    id_expr: "auth.uid"
    username: $username
    email: $email
    photoUrl: $photoUrl
  })
}