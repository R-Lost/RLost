mutation CreateItem(
  $itemName: String!
  $description: String
  $location: String
  $imageLink: String
  $category: String
  $lostStatus: Boolean!
) @auth(level: PUBLIC) {
  item_insert(data: {
    itemName: $itemName
    description: $description
    location: $location
    imageLink: $imageLink
    category: $category
    lostStatus: $lostStatus
  })
} # In future need to make auth level @user I think