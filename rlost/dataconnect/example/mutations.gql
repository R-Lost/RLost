mutation CreateItem(
  $itemName: String!
  $description: String
  $location: String
  $imageLink: String
  $category: String
  $lostStatus: Boolean!
  $locationTurnedIn: String
  $timeFound: String
) @auth(level: PUBLIC) {
  item_insert(data: {
    itemName: $itemName
    description: $description
    location: $location
    imageLink: $imageLink
    category: $category
    lostStatus: $lostStatus
    locationTurnedIn: $locationTurnedIn
    timeFound: $timeFound
  })
} # In future need to make auth level @user I think
mutation UpsertUser(
  $id: String!
  $username: String!
  $email: String!
  $photoUrl: String
) @auth(level: PUBLIC) {
  user_upsert(data: {
    id: $id
    username: $username
    email: $email
    photoUrl: $photoUrl
  })
}