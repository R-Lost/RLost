# Each @table directive creates a PostgreSQL table

type User @table {
  # @default(expr: "auth.uid") binds the ID to Firebase Auth
  id: String! @default(expr: "auth.uid")
  username: String! @col(dataType: "varchar(50)")
  email: String!
  createdAt: Timestamp! @default(expr: "request.time")
} # this was here by default, but can be expanded upon for the user schema

type Item @table {
  id: UUID! @default(expr: "uuidV4()")
  itemName: String!,
  description: String,
  location: String,
  imageLink: String,
  category: String,
  lostStatus: Boolean! @default(value: true)
}