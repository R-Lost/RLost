# Each @table directive creates a PostgreSQL table

type User @table {
  # @default(expr: "auth.uid") binds the ID to Firebase Auth
  id: String! @default(expr: "auth.uid")
  username: String! 
  email: String!,
  photoUrl: String,
  # no password needed i believe because we're just signing in with google.
  createdAt: Timestamp! @default(expr: "request.time")
} # this was here by default, but can be expanded upon for the user schema

type Item @table {
  id: UUID! @default(expr: "uuidV4()")
  itemName: String!,
  description: String,
  location: String,
  imageLink: String,
  category: String,
  lostStatus: Boolean! @default(value: true),
  locationTurnedIn: String,
  timeFound: String,
  createdAt: Timestamp! @default(expr: "request.time")
  # add a created at and then in addItemForm have it autopopulate this with current time, idt above is right approach
}